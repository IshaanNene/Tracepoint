name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26.6"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: gofmt
        run: |
          out="$(gofmt -s -l . | grep -v '^$' || true)"
          if [ -n "$out" ]; then echo "unformatted files:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v2.12.2

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: unit tests (-race)
        run: go test -race -shuffle=on -count=1 ./...
        env:
          CGO_ENABLED: "1"

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: cross-compile a static binary
        run: go build -trimpath -o /dev/null ./cmd/tracepoint
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check jsonschema
      # Rename completeness, JSON Schema validity, schema fixtures. From phase 1 this
      # also covers golden files, the MCP tool-list and OpenAPI snapshots and apidiff.
      - run: ./scripts/check-contracts.sh
        env:
          CI: "true"

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: coverage with gates
        shell: bash
        run: |
          set -euo pipefail
          # The gates activate with the first test; until then there is nothing to gate.
          if ! find . -name '*_test.go' -not -path './.git/*' | grep -q .; then
            echo "no test files yet — coverage gates activate in phase 1"; exit 0
          fi
          # -coverpkg spans the module: the end-to-end tests drive the engine, the
          # result builder and the renderers through the command tree, and without it
          # those packages report zero despite being exercised on every run.
          CGO_ENABLED=1 go test -race -count=1 -covermode=atomic -coverpkg=./... -coverprofile=coverage.txt ./...
          total="$(go tool cover -func=coverage.txt | awk '/^total:/ {gsub(/%/,"",$3); print $3}')"
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit !(t+0 >= 70) }' \
            || { echo "FAIL: overall coverage ${total}% is below the 70% gate (§10)"; exit 1; }
          # Per-package floors for the math-heavy packages.
          fail=0
          for pkg in schedule metrics analysis capacity compare; do
            pct="$(go tool cover -func=coverage.txt \
                   | awk -v p="/internal/$pkg/" '$0 ~ p {gsub(/%/,"",$NF); s+=$NF; n++} END {if (n) printf "%.1f", s/n}')"
            [ -z "$pct" ] && { echo "internal/$pkg: no coverage recorded yet"; continue; }
            echo "internal/$pkg: ${pct}%"
            awk -v t="$pct" 'BEGIN { exit !(t+0 >= 85) }' \
              || { echo "FAIL: internal/$pkg at ${pct}% is below the 85% gate (§10)"; fail=1; }
          done
          exit $fail

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  integration:
    name: integration (testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: postgres, mysql and redis via testcontainers
        run: go test -race -count=1 -tags=integration -timeout=20m ./...
        env:
          CGO_ENABLED: "1"

  e2e:
    name: e2e (known-answer suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # Each injected fault must produce its known verdict class (§10).
      - run: go test -race -count=1 -tags=e2e -timeout=30m ./...
        env:
          CGO_ENABLED: "1"
